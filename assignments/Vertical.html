<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vertical Box</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 300px;
            padding: 20px;
            background-color: #c9b3e5;
            border-radius: 20px;
            text-align: center;
        }

        h2 {
            font-size: 20px;
            color: #4a3a70;
            margin-bottom: 20px;
            font-style: italic;
        }

        .box {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .small-text {
            font-size: 14px;
            color: #555;
            margin-bottom: 5px;
        }

        .big-text {
            font-size: 22px;
            font-weight: bold;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Highest & Average CTC</h2>

        <div class="box">
            <p class="small-text">Expected Increase in Salary Potential</p>
            <p class="big-text">60%</p>
        </div>

        <div class="box">
            <p class="small-text">Average CTC</p>
            <p class="big-text">₹6.1 LPA</p>
        </div>

        <div class="box">
            <p class="small-text">Highest CTC</p>
            <p class="big-text">₹36 LPA</p>
        </div>
    </div>

</body>
</html>

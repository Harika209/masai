<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            width: 300px;
            height: 400px;
            padding: 20px;
            margin: auto;
            border: 2px solid black;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            background: #fff;
            text-align: center;
        }

        .card img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h2 {
            margin: 10px 0;
        }

        p {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="file:///Users/koppisettiharika/Downloads/WhatsApp%20Image%200007-09-02%20at%2017.09.49.jpeg" alt="Profile Image" />
        <h2>Harika K</h2>
        <p>A passionate web developer who loves creating beautiful designs and clean code.</p>
    </div>

</body>
</html>
